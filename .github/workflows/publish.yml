name: Publish Acode Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'plugin.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Zip File
        run: zip -r plugin.zip main.js plugin.json readme.md icon.png changelogs.md

      - name: Publish to Acode Store
        uses: Acode-Foundation/publish-plugin@v1
        with:
          api-key: ${{ secrets.ACODE_API_KEY }}
          plugin-zip: plugin.zip
